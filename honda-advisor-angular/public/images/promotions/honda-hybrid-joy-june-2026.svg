    <text x="34" y="54" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="950">Selected June 2026 Rewards</text>
    <text x="34" y="88" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Values vary by model, variant, excise year, eligibility, and available stock.</text>

    <g transform="translate(34 126)">
      <rect width="312" height="122" rx="24" fill="url(#card)" stroke="#e5e7eb"/>
      <text x="22" y="36" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="950">City</text>
      <text x="22" y="78" fill="#c8102e" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="950">up to RM10k*</text>
      <text x="22" y="105" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">+ Double Bonanza Rewards*</text>
      <image href="/images/cars/city/hero.webp" x="156" y="36" width="138" height="76" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <g transform="translate(372 126)">
      <rect width="312" height="122" rx="24" fill="url(#card)" stroke="#e5e7eb"/>
      <text x="22" y="36" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="950">WR-V</text>
      <text x="22" y="80" fill="#c8102e" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="950">RM11k*</text>
      <text x="22" y="105" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">Cash rebate + Joy Reward*</text>
      <image href="/images/cars/wr-v/hero.webp" x="152" y="36" width="140" height="76" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <g transform="translate(710 126)">
      <rect width="312" height="122" rx="24" fill="url(#card)" stroke="#e5e7eb"/>
      <text x="22" y="36" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="950">Civic</text>
      <text x="22" y="80" fill="#c8102e" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="950">up to RM12k*</text>
      <text x="22" y="105" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">e:HEV RS includes Hybrid Support*</text>
      <image href="/images/cars/civic/hero.webp" x="154" y="36" width="140" height="76" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <g transform="translate(34 270)">
      <rect width="312" height="122" rx="24" fill="url(#card)" stroke="#e5e7eb"/>
      <text x="22" y="36" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="950">HR-V</text>
      <text x="22" y="80" fill="#c8102e" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="950">up to RM11k*</text>
      <text x="22" y="105" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">Selected variants only*</text>
      <image href="/images/cars/hr-v/hero.webp" x="152" y="35" width="140" height="78" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <g transform="translate(372 270)">
      <rect width="312" height="122" rx="24" fill="url(#card)" stroke="#e5e7eb"/>
      <text x="22" y="36" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="950">CR-V</text>
      <text x="22" y="80" fill="#c8102e" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="950">RM9k*</text>
      <text x="22" y="105" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">Selected CR-V variants*</text>
      <image href="/images/cars/cr-v/hero.webp" x="150" y="36" width="144" height="78" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <g transform="translate(710 270)">
      <rect width="312" height="122" rx="24" fill="#111827" stroke="#374151"/>
      <text x="22" y="36" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="950">e:N1</text>
      <text x="22" y="80" fill="url(#gold)" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="950">RM34k*</text>
      <text x="22" y="105" fill="#d1d5db" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">2025 model reward reference*</text>
      <image href="/images/cars/en1/hero.webp" x="150" y="36" width="144" height="78" preserveAspectRatio="xMidYMid meet"/>
    </g>
