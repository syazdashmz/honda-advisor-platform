  <g transform="translate(72 1188)" filter="url(#shadow)">
    <rect width="1056" height="190" rx="34" fill="#c8102e"/>
    <rect x="754" width="302" height="190" rx="34" fill="#111827"/>
    <text x="34" y="52" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="900" letter-spacing="1.8">READY TO CHECK ELIGIBILITY?</text>
    <text x="34" y="96" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="950">Ask Fauziah to check your</text>
    <text x="34" y="132" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="950">Honda reward eligibility</text>
    <text x="34" y="164" fill="#ffe4e6" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="850">Model selection • loan guidance • appointment • delivery support</text>

    <text x="790" y="62" fill="#fca5a5" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="900">CONTACT FAUZIAH</text>
    <text x="790" y="112" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="950">012 267 1977</text>
    <text x="790" y="150" fill="#d1d5db" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800">Tenaga Setia Resources</text>
  </g>

  <text x="72" y="1428" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">*Promotion reference based on Honda Malaysia June 2026 “Experience More Hybrid Joy”. Registration period: 1 June 2026 to 30 June 2026.</text>
  <text x="72" y="1454" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Terms, eligibility, variant, excise year, and stock conditions apply. Final details must be confirmed with the advisor, dealership, or Honda Malaysia.</text>
  <text x="72" y="1480" fill="#9ca3af" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">This advisor website is not an official Honda Malaysia website.</text>
